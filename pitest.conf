; Instellingen voor de hardwaretest. Bewerk dit bestand gewoon op je pc
; (het staat op de bootpartitie van de SD-kaart).

[pitest]
; Hoe lang de CPU volledig belast wordt
stress_minutes = 10

; Boven deze temperatuur krijg je een waarschuwing
max_temp_c = 82

; Hoeveel RAM memtester controleert (meer = grondiger, maar trager)
memtest_mb = 512

; Grootte van de schrijf/lees-test op de opslag
storage_test_mb = 256

; Adres voor de internettest via ethernet
ping_host = 1.1.1.1

; GPIO-loopback: verbind twee pinnen met een jumperdraadje en vul ze hier in
; (BCM-nummers). Leeg = test overslaan. Voorbeeld: 17-27, 22-23
gpio_pairs =
